# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

# Environment variables and secrets.
env:
  # Configure environment variables for Streamlit
  - variable: STREAMLIT_SERVER_PORT
    value: "8080"
    availability:
      - RUNTIME
  - variable: STREAMLIT_SERVER_ADDRESS
    value: "0.0.0.0"
    availability:
      - RUNTIME
  - variable: STREAMLIT_SERVER_HEADLESS
    value: "true"
    availability:
      - RUNTIME
  - variable: STREAMLIT_BROWSER_GATHER_USAGE_STATS
    value: "false"
    availability:
      - RUNTIME
